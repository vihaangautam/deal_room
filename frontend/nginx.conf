# Serves the built SPA and proxies the API on one origin.
#
# The API is mounted at the root (app/main.py has no global prefix) and
# its paths collide with the SPA's own routes: /deals is both "the deals
# page" and "GET the deals JSON", and so is /admin/users. Enumerating the
# API's prefixes here therefore cannot work — it sends the browser's
# navigation to /deals into the API and the user gets JSON instead of the
# app.
#
# So the API gets a /api prefix at the edge, which nginx strips before
# proxying. The backend is unchanged and still serves /deals etc.; the
# frontend is built with VITE_API_URL=/api so every call it makes is
# prefixed. Nothing else in the URL space is ambiguous after that.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PRD F5 allows 2 GB files, uploaded in 32 MB chunks
    # (hooks/useUpload.ts). Nginx defaults to 1 MB and would reject every
    # chunk with a 413 before it reached the API.
    client_max_body_size 40m;

    # A 32 MB chunk over a slow line, then a single PUT of up to 2 GB from
    # the API to object storage, both need longer than the 60s default.
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location /api/ {
        # Resolved per request through a variable, with Docker's embedded
        # DNS. A literal `proxy_pass http://api:8000` is resolved once at
        # config load, so a missing or still-starting API makes nginx exit
        # with "host not found in upstream" and crash-loop — taking the
        # static site down too. This way API calls 502 while the app
        # itself still loads.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit log records the actor's IP (request.client.host),
        # which without this is the proxy's own address on every row.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A download is a 302 to a presigned URL the browser follows
        # itself; buffering would pull the whole object through here.
        proxy_buffering off;
        proxy_redirect off;
    }

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted Inter (DESIGN §3.2). Immutable too.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers asking
    # for asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: /deals/<id>/documents is a React route, not a
    # file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
