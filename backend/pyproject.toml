[project]
name = "lilkis-deal-room-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.30.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "sqlalchemy==2.0.*",
    "asyncpg",
    "psycopg[binary]",  # sync driver, Alembic migrations only — app uses asyncpg
    "alembic==1.13.*",
    "fastapi-users[sqlalchemy]==13.*",
    "argon2-cffi==23.*",
    "boto3==1.35.*",
    "procrastinate==2.*",
    "slowapi==0.1.*",
    "structlog==24.*",
    "httpx==0.27.*",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
